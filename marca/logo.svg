<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="12" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#orbitGrad)"/>
  <!-- Orbiting ring 1 -->
  <ellipse cx="20" cy="20" rx="13" ry="5.5" transform="rotate(-30 20 20)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="60 15" stroke-opacity="0.9"/>
  <!-- Central core planet -->
  <circle cx="20" cy="20" r="5" fill="url(#coreGrad)"/>
  <!-- Orbiting satellite node -->
  <circle cx="29" cy="15" r="2.2" fill="#06B6D4" stroke="white" stroke-width="1.2"/>
  <circle cx="11" cy="25" r="1.8" fill="#F43F5E" stroke="white" stroke-width="1"/>
</svg>